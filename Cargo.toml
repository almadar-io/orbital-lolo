[package]
name = "orbital-lolo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lexer, parser, and lowering for the .lolo surface language to OrbitalSchema (.orb JSON)"

[dependencies]
orbital-core-base = { path = "../orbital-core/crates/base" }
orbital-core-eval = { path = "../orbital-core/crates/eval" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
tracing.workspace = true

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"

[dev-dependencies]
pretty_assertions.workspace = true
orbital-compiler = { path = "../orbital-compiler" }
orbital-test-support = { path = "../orbital-test-support" }
orbital-core-runtime = { path = "../orbital-core/crates/runtime" }
serde_json.workspace = true
tempfile = "3.10"
